name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath "$env:APPDATA\XIVLauncher\addon\Hooks\dev" -Force

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = [version]("${{ github.ref_name }}".TrimStart('v'))

          $version = '{0}.{1}.{2}.{3}' -f `
            $tag.Major, $tag.Minor, [Math]::Max($tag.Build, 0), [Math]::Max($tag.Revision, 0)

          "${{ github.ref_name }} will be published as $version."
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Read the changelog from the tag
        shell: pwsh
        run: |
          $notes = ((git tag -l --format='%(contents)' "${{ github.ref_name }}") -join "`n").Trim()

          if ($notes) {
            "${{ github.ref_name }} carries $($notes.Length) characters of changelog."
          }
          else {
            "${{ github.ref_name }} has no annotation, so the changelog is left as it was."
          }

          Set-Content -Path "$env:RUNNER_TEMP\changelog.txt" -Value $notes -Encoding utf8

      - name: Set assembly version
        shell: pwsh
        run: |
          $path = 'Hornwatch\Hornwatch.csproj'
          (Get-Content $path -Raw) -replace '<Version>[^<]*</Version>', "<Version>${{ steps.version.outputs.version }}</Version>" |
            Set-Content $path -NoNewline

      - name: Build
        run: dotnet build Hornwatch.slnx -c Release

      - name: Locate package
        id: package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path Hornwatch\bin\x64\Release -Recurse -Filter latest.zip | Select-Object -First 1
          "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ steps.package.outputs.path }}
          generate_release_notes: true

      - name: Checkout plugin index
        uses: actions/checkout@v4
        with:
          repository: EllinaeXIV/DalamudPlugins
          path: plugin-index
          token: ${{ secrets.PLUGINMASTER_TOKEN }}

      - name: Update pluginmaster.json
        shell: pwsh
        run: |
          $path = 'plugin-index/pluginmaster.json'
          $manifest = @(Get-Content $path -Raw | ConvertFrom-Json)

          $entry = $manifest | Where-Object { $_.InternalName -eq 'Hornwatch' }
          $entry.AssemblyVersion = "${{ steps.version.outputs.version }}"

          $notes = (Get-Content "$env:RUNNER_TEMP\changelog.txt" -Raw).Trim()
          if ($notes) {
            $entry | Add-Member -NotePropertyName Changelog -NotePropertyValue $notes -Force
          }

          $manifest | ConvertTo-Json -Depth 10 -AsArray | Set-Content $path

      - name: Commit pluginmaster.json
        shell: pwsh
        working-directory: plugin-index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet || git commit -m "Update Hornwatch to ${{ github.ref_name }}"
          git push origin HEAD:main

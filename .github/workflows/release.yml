name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath "$env:APPDATA\XIVLauncher\addon\Hooks\dev" -Force

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v') + '.0'
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set assembly version
        shell: pwsh
        run: |
          $path = 'Hornwatch\Hornwatch.csproj'
          (Get-Content $path -Raw) -replace '<Version>[^<]*</Version>', "<Version>${{ steps.version.outputs.version }}</Version>" |
            Set-Content $path -NoNewline

      - name: Build
        run: dotnet build Hornwatch.slnx -c Release

      - name: Locate package
        id: package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path Hornwatch\bin\x64\Release -Recurse -Filter latest.zip | Select-Object -First 1
          "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ steps.package.outputs.path }}
          generate_release_notes: true

      - name: Update pluginmaster.json
        shell: pwsh
        run: |
          $manifest = Get-Content pluginmaster.json -Raw | ConvertFrom-Json
          $manifest[0].AssemblyVersion = "${{ steps.version.outputs.version }}"
          $manifest | ConvertTo-Json -Depth 10 | Set-Content pluginmaster.json

      - name: Commit pluginmaster.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet || git commit -m "Update pluginmaster.json for ${{ github.ref_name }}"
          git push origin HEAD:main
